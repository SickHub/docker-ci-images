name: Build and push misc images to GHCR

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # monthly: 1st of month 5:03 am, UTC (replaces CircleCI 'monthly' build_misc job)
  schedule:
    - cron: "3 5 1 * *"

jobs:
  build-and-push-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/misc-images.yml
    with:
      version: "latest"
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      docker_user: ${{ secrets.DOCKER_USER }}
      docker_pass: ${{ secrets.DOCKER_PASS }}
