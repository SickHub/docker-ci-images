name: Build and push x86 images to GHCR

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  # weekly: Mondays 6:03 am, UTC (replaces CircleCI 'weekly' build86 job)
  schedule:
    - cron: "3 6 * * 1"

jobs:
  build-and-push-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/x86-images.yml
    with:
      version: "latest"
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      docker_user: ${{ secrets.DOCKER_USER }}
      docker_pass: ${{ secrets.DOCKER_PASS }}
