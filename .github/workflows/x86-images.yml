name: Build and push x86 images

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      token:
        required: true
      docker_user:
        required: true
      docker_pass:
        required: true

env:
  # Tool versions are maintained by Renovate directly in the Dockerfiles.
  push_condition: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: ["argocd-kubectl"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_user }}
          password: ${{ secrets.docker_pass }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./images_x86/${{ matrix.image }}
          file: ./images_x86/${{ matrix.image }}/Dockerfile
          push: ${{ env.push_condition }}
          tags: |
            ghcr.io/sickhub/${{ matrix.image }}:${{ inputs.version }}
            ghcr.io/sickhub/${{ matrix.image }}:git-${{ github.sha }}
            drpsychick/${{ matrix.image }}:${{ inputs.version }}
            drpsychick/${{ matrix.image }}:git-${{ github.sha }}
          platforms: "linux/amd64"
